<style>
    /* Botón Flotante */
    .floating-cart-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 65px;
        height: 65px;
        background: var(--primary-color, #ff4757);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        box-shadow: 0 10px 25px rgba(255, 71, 87, 0.4);
        cursor: pointer;
        z-index: 999;
        border: none;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .floating-cart-btn:hover { transform: scale(1.1); }
    .cart-badge {
        position: absolute;
        top: -5px;
        right: -5px;
        background: #111;
        color: white;
        font-size: 0.9rem;
        font-weight: bold;
        width: 25px;
        height: 25px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid white;
    }

    /* Fondo Oscuro al abrir el carrito */
    .cart-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: 0.3s ease;
        backdrop-filter: blur(3px);
    }
    .cart-overlay.active { opacity: 1; visibility: visible; }

    /* Panel Lateral del Carrito */
    .cart-sidebar {
        position: fixed;
        top: 0; right: -400px;
        width: 100%;
        max-width: 380px;
        height: 100vh;
        background: #fff;
        z-index: 1001;
        box-shadow: -5px 0 30px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        transition: right 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .cart-sidebar.active { right: 0; }

    /* Cabecera del Panel */
    .cart-header {
        padding: 20px;
        background: #fdfdfd;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .cart-header h3 { margin: 0; font-size: 1.3rem; font-weight: 800; color: #111; }
    .close-cart { background: none; border: none; font-size: 1.5rem; color: #888; cursor: pointer; transition: 0.2s; }
    .close-cart:hover { color: #ff4757; transform: rotate(90deg); }

    /* Lista de Items */
    .cart-items {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
    }
    .cart-empty-msg { text-align: center; color: #aaa; margin-top: 50px; }
    .cart-empty-msg i { font-size: 4rem; margin-bottom: 15px; color: #eee; }
    
    .cart-item {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px dashed #eee;
        position: relative;
    }
    .cart-item-img {
        width: 70px; height: 70px;
        border-radius: 12px;
        object-fit: cover;
        border: 1px solid #eee;
    }
    .cart-item-info { flex: 1; }
    .cart-item-title { font-weight: 700; font-size: 1rem; color: #333; margin-bottom: 5px; line-height: 1.2; }
    .cart-item-price { color: var(--primary-color, #ff4757); font-weight: bold; }
    
    /* Controles de cantidad */
    .qty-controls { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ddd; background: #fff; color: #555; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .qty-btn:active { background: #eee; }
    
    .remove-item {
        position: absolute;
        top: 0; right: 0;
        background: none; border: none;
        color: #ccc; cursor: pointer; font-size: 1.1rem;
    }
    .remove-item:hover { color: #ff4757; }

    /* Footer del Carrito (Total y Botón WhatsApp) */
    .cart-footer {
        padding: 25px 20px;
        background: #fff;
        border-top: 1px solid #eee;
        box-shadow: 0 -10px 20px rgba(0,0,0,0.02);
    }
    .cart-total {
        display: flex;
        justify-content: space-between;
        font-size: 1.4rem;
        font-weight: 900;
        margin-bottom: 20px;
        color: #111;
    }
    .btn-checkout {
        width: 100%;
        padding: 18px;
        background: #25D366;
        color: white;
        border: none;
        border-radius: 50px;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        transition: 0.3s;
        box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
    }
    .btn-checkout:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(37, 211, 102, 0.4); }
    .btn-clear { width: 100%; background: none; border: none; color: #aaa; margin-top: 15px; cursor: pointer; text-decoration: underline; font-size: 0.9rem; }
    
    /* Pequeña animación para cuando se añade un producto */
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    .pop-anim { animation: pop 0.4s ease; }
</style>

<button id="floatingCartBtn" class="floating-cart-btn" type="button" aria-label="Abrir carrito">
    <i class="fas fa-shopping-cart"></i>
    <span id="cartBadge" class="cart-badge">0</span>
</button>
<link rel="stylesheet" href="/css/shop-extras.css">
<script>
    (function syncFloatingCart() {
        function count() {
            try {
                const cart = JSON.parse(localStorage.getItem('ferumi_cart') || '[]');
                return cart.reduce((s, i) => s + (i.quantity || 1), 0);
            } catch (e) { return 0; }
        }
        function paint() {
            const badge = document.getElementById('cartBadge');
            if (badge) badge.innerText = count();
        }
        document.getElementById('floatingCartBtn')?.addEventListener('click', () => {
            if (typeof window.openFerumiCart === 'function') window.openFerumiCart();
            else document.getElementById('cart-icon')?.click();
        });
        paint();
        setInterval(paint, 1200);
    })();
</script>
