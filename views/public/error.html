<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - FERUMI</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<%- include('../partials/header.html') %>

<main class="fm-page fm-error">
    <section class="fm-empty">
        <p class="fm-kicker">Error</p>
        <h1>No pudimos mostrar <em>esta página</em></h1>
        <p><%= locals.message ? message : 'La página que buscás no existe o cambió de lugar.' %></p>
        <div class="fm-error-actions">
            <a href="/" class="btn btn-primary">Volver al inicio</a>
            <a href="/tienda" class="btn btn-secondary">Ver la tienda</a>
        </div>
    </section>
</main>

<%- include('../partials/footer.html') %>

</body>
</html>
